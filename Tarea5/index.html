<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repaso UD01 - Tarea 5 - Miguel Sánchez-Lafuente Bosch</title>
</head>
<body>
    <h1>Taller de introducción a la Programación</h1>
    <p>Quedan plazas limitadas para esta edición.</p>
    <!-- Para comentarios (quotes) es la etiqueta <q>-->
    <p><q>Learning never exhausts the mind</q> - Leonardo da Vinci</p>
    <form action="" method="post">
        <label for="nombre">Nombre completo: </label> <br/>
        <input type="text" id="nombre" name="nombre" placeholder="Nombre y apellidos" required> <br/>
        
        <label for="correo">Correo electrónico: </label> <br/>
        <input type="email" id="correo" name="correo" placeholder="tu@correo.com" required> <br/>

        <label for="fecha">Fecha de nacimiento: </label> <br/>
        <input type="date" id="fecha" name="fecha" required> <br/>
        
        <label for="numero">Edad: </label> <br/>
        <input type="number" id="numero" name="numero"  min="1" max="100" required> <br/>

        <label for="select">Turno preferido: </label> <br/>
        <select id="select" name="select" required>
            <option value="mañana" selected>Mañana</option>
            <option value="tarde">Tarde</option>
            <option value="noche">Noche</option>
        </select>
        <br/><br/>
        <button type="submit">Inscribirme</button>
        <button type="reset">Borrar formulario</button>        
    </form>   
</body>
</html>
